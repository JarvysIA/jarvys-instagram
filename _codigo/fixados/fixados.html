<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url(inter-latin-400-normal.woff);font-weight:400}
@font-face{font-family:Inter;src:url(inter-latin-500-normal.woff);font-weight:500}
@font-face{font-family:Inter;src:url(inter-latin-600-normal.woff);font-weight:600}
@font-face{font-family:Inter;src:url(inter-latin-700-normal.woff);font-weight:700}
@font-face{font-family:Inter;src:url(inter-latin-800-normal.woff);font-weight:800}
@font-face{font-family:Orbitron;src:url(orbitron-latin-700-normal.woff);font-weight:700}
:root{--bg:#0c192a;--card:#172537;--fg:#f0f6fc;--muted:#97a7b7;--neon:#3ac7ff;--on:#061223;--soft:rgba(58,199,255,.15);--border:rgba(40,61,78,.95);--ok:#41d686;--warn:#f9c718;--bad:#f94144}
*{box-sizing:border-box;margin:0}
body{background:#000;font-family:Inter;color:var(--fg);width:3104px}
.abs{position:absolute}
.neon{color:var(--neon);text-shadow:0 0 30px rgba(58,199,255,.55)}
.lab{font-family:Orbitron;font-weight:700;font-size:30px;letter-spacing:8px;color:var(--neon)}
.h{font-weight:800;letter-spacing:-3px;line-height:1.02}
.p{font-size:36px;line-height:1.45;color:var(--muted)}
.wm{display:flex;align-items:center;gap:16px;font-family:Orbitron;font-weight:700;font-size:28px;letter-spacing:6px}
.wm img{width:60px;height:60px;border-radius:16px}
/* panorama */
#pano{position:relative;width:3104px;height:1350px;overflow:hidden;background:var(--bg)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(58,199,255,.16) 2px,transparent 2.6px);background-size:54px 54px}
.glow{position:absolute;border-radius:50%;filter:blur(10px)}
.tile{position:absolute;top:0;width:1012px;height:1350px;padding:110px 76px 90px}
.hub{position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#14324d,#0b1c2f);border:5px solid var(--neon);box-shadow:0 0 90px rgba(58,199,255,.65),inset 0 0 40px rgba(58,199,255,.25);display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%)}
.hub img{width:186px;height:186px;border-radius:50%}
.chat{background:var(--card);border:3px solid var(--border);border-radius:44px;padding:34px;box-shadow:0 40px 120px -30px rgba(58,199,255,.5)}
.chead{display:flex;align-items:center;gap:18px;padding-bottom:22px;border-bottom:3px solid var(--border)}
.chead img{width:70px;height:70px;border-radius:50%}
.chead b{font-size:32px;display:block}.chead small{font-size:24px;color:var(--ok)}
.msgs{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.m{max-width:640px;padding:16px 24px;font-size:31px;line-height:1.38;border-radius:32px}
.u{align-self:flex-end;background:rgba(58,199,255,.2);border-bottom-right-radius:8px}
.b{align-self:flex-start;background:rgba(12,25,42,.8);border:3px solid var(--border);border-bottom-left-radius:8px}
.price{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:3px solid var(--border);border-radius:32px;padding:30px 36px;margin-top:22px}
.price.hi{background:var(--soft);border-color:var(--neon);box-shadow:0 0 60px -10px rgba(58,199,255,.55)}
.price .t{font-size:34px;font-weight:700}.price .s{font-size:26px;color:var(--muted);margin-top:4px}
.price .v{font-size:54px;font-weight:800;white-space:nowrap}
.swipe{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:600;color:var(--neon)}
.swipe svg{width:34px;height:34px;stroke:var(--neon);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* slides internos */
.sl{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg);padding:96px 80px 80px;display:flex;flex-direction:column}
.sl .dots{-webkit-mask-image:radial-gradient(circle at 50% 30%,#000 0,transparent 70%)}
.sl .g{position:absolute;left:-200px;top:-300px;width:1480px;height:1200px;border-radius:50%;background:radial-gradient(circle,rgba(58,199,255,.22),rgba(12,25,42,0) 60%)}
.row{display:flex;gap:28px;align-items:flex-start;background:var(--card);border:3px solid var(--border);border-radius:34px;padding:30px 34px;margin-top:22px}
.row .ic{flex:none;width:84px;height:84px;border-radius:24px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.row svg{width:46px;height:46px;stroke:var(--neon);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row b{font-size:38px;display:block}.row span{font-size:30px;color:var(--muted);line-height:1.4;display:block;margin-top:6px}
.num{flex:none;width:84px;height:84px;border-radius:50%;background:var(--neon);color:var(--on);font-family:Orbitron;font-weight:700;font-size:38px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(58,199,255,.6)}
.btn{display:inline-block;background:var(--neon);color:var(--on);font-size:48px;font-weight:800;padding:34px 70px;border-radius:999px;box-shadow:0 0 0 3px rgba(58,199,255,.35),0 26px 90px -10px rgba(58,199,255,.75)}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:26px;color:var(--muted)}
.foot b{color:var(--neon);font-weight:600}
.pg{font-family:Orbitron;font-size:24px;letter-spacing:4px;color:var(--muted)}
</style></head><body>
<script>
const I='icon-512.png';
const S=(p)=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const IC={
 fuel:S('<path d="M3 22V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v17"/><path d="M3 11h12"/><path d="M15 8h2a2 2 0 0 1 2 2v7a2 2 0 0 0 4 0V9l-3-3"/>'),
 doc:S('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>'),
 wrench:S('<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>'),
 doctor:S('<path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6 6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6 6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/>'),
 arrow:S('<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>'),
 check:'<svg width="40" height="40" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="#41d686"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#061223" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
const swipe=(t='Arrasta pro lado')=>`<div class="swipe">${t}${IC.arrow}</div>`;
const wm=()=>`<div class="wm"><img src="${I}">JARVYS</div>`;
// ---------- PANORAMA (3 posts fixados). Canvas 3104 = 34 + 3x1012 + 34. Cada post = recorte de 1080 começando em i*1012.
const X=(i)=>34+i*1012;
let h=`<div id="pano"><div class="dots"></div>
 <div class="glow" style="left:-300px;top:500px;width:1400px;height:1100px;background:radial-gradient(circle,rgba(58,199,255,.20),transparent 62%)"></div>
 <div class="glow" style="left:900px;top:200px;width:1300px;height:1300px;background:radial-gradient(circle,rgba(58,199,255,.24),transparent 60%)"></div>
 <div class="glow" style="left:2000px;top:450px;width:1400px;height:1100px;background:radial-gradient(circle,rgba(58,199,255,.18),transparent 62%)"></div>
 <svg class="abs" style="left:0;top:0" width="3104" height="1350" viewBox="0 0 3104 1350" fill="none">
  <defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#3ac7ff" stop-opacity=".2"/><stop offset=".5" stop-color="#3ac7ff"/><stop offset="1" stop-color="#3ac7ff" stop-opacity=".25"/></linearGradient>
  <filter id="bl"><feGaussianBlur stdDeviation="10"/></filter></defs>
  <path d="M-20 1180 C 300 1180, 420 1010, 560 1010 S 900 1220, 1300 1180 S 1800 1000, 2100 1080 S 2700 1240, 3130 1120" stroke="#3ac7ff" stroke-width="18" opacity=".35" filter="url(#bl)"/>
  <path d="M-20 1180 C 300 1180, 420 1010, 560 1010 S 900 1220, 1300 1180 S 1800 1000, 2100 1080 S 2700 1240, 3130 1120" stroke="url(#lg)" stroke-width="5"/>
  ${[[560,1010],[1550,1137],[2440,1150]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="13" fill="#bff0ff"/><circle cx="${x}" cy="${y}" r="30" fill="#3ac7ff" opacity=".25"/>`).join('')}
 </svg>`;
// tile 1: o que e
h+=`<div class="tile" style="left:${X(0)}px">
 ${wm()}
 <div class="lab" style="margin-top:84px">01 · O QUE É</div>
 <div class="h" style="font-size:110px;margin-top:26px">Seu carro<br><span class="neon">numa conversa.</span></div>
 <div class="p" style="margin-top:34px;max-width:820px">Gastos, notas da oficina, revisão e dúvidas. Tudo no WhatsApp, com o Jarvys.</div>
 <div class="abs" style="left:76px;bottom:90px">${swipe()}</div>
</div>
<div class="hub" style="left:560px;top:1010px">
 <img src="${I}"></div>`;
// tile 2: como funciona
h+=`<div class="tile" style="left:${X(1)}px">
 <div class="lab" style="margin-top:84px;padding-top:60px">02 · COMO FUNCIONA</div>
 <div class="h" style="font-size:110px;margin-top:26px">Mandou,<br><span class="neon">anotei.</span></div>
 <div class="chat" style="margin-top:44px;width:860px;padding:28px 32px">
  <div class="chead"><img src="${I}"><div><b>Jarvys</b><small>online</small></div></div>
  <div class="msgs">
   <div class="m u">gastei 150 de gasolina</div>
   <div class="m b">Anotar <b>R$&nbsp;150,00</b> em Combustível? Responda sim para confirmar.</div>
   <div class="m u">sim</div>
   <div class="m b" style="display:flex;align-items:center;gap:14px">${IC.check}Anotado!</div>
  </div></div>
 <div class="abs" style="left:76px;bottom:90px">${swipe()}</div>
</div>`;
// tile 3: quanto custa
h+=`<div class="tile" style="left:${X(2)}px">
 <div class="lab" style="margin-top:84px;padding-top:60px">03 · QUANTO CUSTA</div>
 <div class="h" style="font-size:110px;margin-top:26px">Comece<br><span class="neon">de graça.</span></div>
 <div class="price" style="margin-top:50px"><div><div class="t">Grátis para sempre</div><div class="s">app inteiro, km e aviso de revisão</div></div><div class="v">R$&nbsp;0</div></div>
 <div class="price hi"><div><div class="t">Completo</div><div class="s">por carro, uma vez só, no Pix</div></div><div class="v neon">R$&nbsp;29,90</div></div>
 <div style="margin-top:30px;font-size:34px;font-weight:700">Teste 30 dias com tudo liberado.</div>
 <div class="abs" style="left:76px;bottom:90px">${swipe()}</div>
</div></div>`;
// ---------- slides internos (1080x1350)
const sl=(id,pg,inner)=>`<div class="sl" id="${id}"><div class="g"></div><div class="dots"></div><div style="position:relative;display:flex;flex-direction:column;height:100%">
 <div style="display:flex;justify-content:space-between;align-items:center">${wm()}<div class="pg">${pg}</div></div>${inner}
 <div class="foot"><span>A IA que cuida do seu carro</span><b>jarvys.com.br</b></div></div></div>`;
const cta=(t1,t2,txt)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
 <div class="hub" style="position:relative;transform:none;left:auto;top:auto"><img src="${I}"></div>
 <div class="h" style="font-size:88px;margin-top:56px">${t1}<br><span class="neon">${t2}</span></div>
 <div class="p" style="margin-top:28px;max-width:860px">${txt}</div>
 <div style="margin-top:56px"><span class="btn">jarvys.com.br</span></div></div>`;
// post 1
h+=sl('s1b','2/3',`<div class="lab" style="margin-top:70px">O QUE EU RESOLVO</div>
 <div class="h" style="font-size:80px;margin-top:22px">Um assistente<br><span class="neon">só pro seu carro.</span></div>
 <div style="margin-top:34px">
 <div class="row"><div class="ic">${IC.fuel}</div><div><b>Anoto seus gastos</b><span>Você fala o valor, eu confirmo e guardo.</span></div></div>
 <div class="row"><div class="ic">${IC.doc}</div><div><b>Leio a nota da oficina</b><span>Pela foto ou PDF. A nota fica guardada comigo.</span></div></div>
 <div class="row"><div class="ic">${IC.wrench}</div><div><b>Aviso da revisão</b><span>Guardo a km e te aviso quando chegar perto.</span></div></div>
 <div class="row"><div class="ic">${IC.doctor}</div><div><b>Dr. Jarvys</b><span>Tira dúvidas pela ficha técnica do seu carro.</span></div></div></div>`);
h+=sl('s1c','3/3',cta('Comece hoje,','é grátis.','Crie sua conta e cadastre o carro pela placa. Os primeiros 30 dias vêm com tudo liberado, sem cartão.'));
// post 2
h+=sl('s2b','2/3',`<div class="lab" style="margin-top:70px">3 PASSOS</div>
 <div class="h" style="font-size:80px;margin-top:22px">Simples como<br><span class="neon">mandar mensagem.</span></div>
 <div style="margin-top:40px">
 <div class="row" style="align-items:center"><div class="num">1</div><div><b>Crie sua conta</b><span>Em jarvys.com.br. Cadastre o carro pela placa.</span></div></div>
 <div class="row" style="align-items:center"><div class="num">2</div><div><b>Fale no WhatsApp</b><span>Mande texto, foto do painel, foto da nota ou áudio.</span></div></div>
 <div class="row" style="align-items:center"><div class="num">3</div><div><b>Eu cuido do resto</b><span>Confirmo com você, anoto e aviso da revisão.</span></div></div></div>`);
h+=sl('s2c','3/3',`<div class="lab" style="margin-top:60px">SEM FILTRO</div>
 <div style="display:flex;gap:44px;margin-top:26px;flex:1;align-items:center">
  <div style="flex:1"><div class="h" style="font-size:74px">Print<br><span class="neon">de verdade.</span></div>
   <div class="p" style="margin-top:28px;font-size:33px">Um usuário mandou só a foto do painel do Fiat Uno. Eu li 129.421 km, ele confirmou com "sim" e pronto.</div>
   <div style="display:flex;align-items:center;gap:12px;margin-top:30px;color:var(--ok);font-size:28px;font-weight:700">${IC.check}Uso real</div></div>
  <div style="flex:none;width:430px;height:932px;border-radius:44px;overflow:hidden;border:4px solid var(--border);box-shadow:0 30px 90px -20px rgba(58,199,255,.5)">
   <img src="prova-uno.jpg" style="width:430px;height:932px;object-fit:cover"></div></div>`);
// post 3
h+=sl('s3b','2/3',`<div class="lab" style="margin-top:70px">SEM LETRA MIÚDA</div>
 <div class="h" style="font-size:80px;margin-top:22px">Grátis ou<br><span class="neon">Completo?</span></div>
 <div class="row" style="flex-direction:column;gap:10px;margin-top:40px"><b>Grátis para sempre · R$&nbsp;0</b><span>O app inteiro: garagem pela placa, Status de Saúde, FIPE, nota pela foto e Dr. Jarvys. No WhatsApp: km e aviso de revisão.</span></div>
 <div class="row" style="flex-direction:column;gap:10px;background:var(--soft);border-color:var(--neon)"><b class="neon">Completo · R$&nbsp;29,90 por carro</b><span>Uma vez só, no Pix, sem mensalidade. Tudo do grátis e o Jarvys completo no WhatsApp: gastos, foto da nota e do painel, preço da revisão e Dr. Jarvys por texto, áudio e foto.</span></div>`);
h+=sl('s3c','3/3',cta('Teste 30 dias','com tudo liberado.','Sem cartão. Se gostar, ativa o Completo por R$ 29,90 por carro, uma vez só.'));
document.body.innerHTML=h;
</script></body></html>
