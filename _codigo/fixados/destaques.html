<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}body{background:#000;width:1080px}
.c{position:relative;width:1080px;height:1920px;background:#0c192a;overflow:hidden;display:flex;align-items:center;justify-content:center}
.c::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(58,199,255,.28),rgba(12,25,42,0) 45%)}
.ring{position:relative;width:640px;height:640px;border-radius:50%;border:10px solid #3ac7ff;box-shadow:0 0 120px rgba(58,199,255,.6),inset 0 0 80px rgba(58,199,255,.25);background:radial-gradient(circle,#14324d,#0b1c2f);display:flex;align-items:center;justify-content:center}
svg{width:330px;height:330px;stroke:#3ac7ff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 22px rgba(58,199,255,.8))}
</style></head><body>
<script>
const S=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const D={
 comece:S('<circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z"/>'),
 'como-usar':S('<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/>'),
 planos:S('<path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r="1.2"/>'),
 provas:S('<path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/>'),
 'dr-jarvys':S('<path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6 6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6 6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/>'),
};
document.body.innerHTML=Object.entries(D).map(([k,v])=>`<div class="c" id="${k}"><div class="ring">${v}</div></div>`).join('');
</script></body></html>
