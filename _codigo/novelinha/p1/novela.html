<script>

const FALA = [[0, 4.3], [4.6, 6.7], [8, 10.5], [10.9, 12.8], [16.4, 18.6], [18.8, 24.2], [24.6, 25.6], [27.6, 30.2]];

window.setT(0).then(() => { window.READY = true; });
