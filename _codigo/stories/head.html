<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url(inter-latin-400-normal.woff);font-weight:400}
@font-face{font-family:Inter;src:url(inter-latin-500-normal.woff);font-weight:500}
@font-face{font-family:Inter;src:url(inter-latin-600-normal.woff);font-weight:600}
@font-face{font-family:Inter;src:url(inter-latin-700-normal.woff);font-weight:700}
@font-face{font-family:Inter;src:url(inter-latin-800-normal.woff);font-weight:800}
@font-face{font-family:Orbitron;src:url(orbitron-latin-700-normal.woff);font-weight:700}
:root{--bg:#0c192a;--card:#172537;--fg:#f0f6fc;--muted:#97a7b7;--neon:#3ac7ff;--on:#061223;--soft:rgba(58,199,255,.15);--border:rgba(40,61,78,.95);--ok:#41d686;--warn:#f9c718;--bad:#f94144}
*{box-sizing:border-box;margin:0}
body{background:#000;font-family:Inter;color:var(--fg);width:1080px}
.st{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);padding:250px 80px 340px;display:flex;flex-direction:column}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(58,199,255,.16) 2px,transparent 2.6px);background-size:54px 54px;-webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0,transparent 75%)}
.g{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(58,199,255,.24),rgba(12,25,42,0) 62%)}
.z{position:relative}
.wm{display:flex;align-items:center;gap:18px;font-family:Orbitron;font-weight:700;font-size:30px;letter-spacing:7px}
.wm img{width:64px;height:64px;border-radius:50%}
.lab{font-family:Orbitron;font-weight:700;font-size:32px;letter-spacing:8px;color:var(--neon)}
.h{font-weight:800;letter-spacing:-3px;line-height:1.04;font-size:96px}
.neon{color:var(--neon);text-shadow:0 0 34px rgba(58,199,255,.55)}
.p{font-size:40px;line-height:1.42;color:var(--muted)}
.chat{background:var(--card);border:3px solid var(--border);border-radius:44px;padding:34px;box-shadow:0 40px 120px -30px rgba(58,199,255,.5)}
.chead{display:flex;align-items:center;gap:18px;padding-bottom:22px;border-bottom:3px solid var(--border)}
.chead img{width:72px;height:72px;border-radius:50%}
.chead b{font-size:34px;display:block}.chead small{font-size:25px;color:var(--ok)}
.msgs{display:flex;flex-direction:column;gap:16px;margin-top:22px}
.m{max-width:700px;padding:18px 26px;font-size:33px;line-height:1.38;border-radius:32px}
.u{align-self:flex-end;background:rgba(58,199,255,.2);border-bottom-right-radius:8px}
.b{align-self:flex-start;background:rgba(12,25,42,.8);border:3px solid var(--border);border-bottom-left-radius:8px}
.doc{display:flex;align-items:center;gap:20px}
.doc .ic{width:96px;height:118px;border-radius:14px;background:#f0f6fc;position:relative;flex:none}
.doc .ic i{position:absolute;left:16px;right:16px;height:7px;border-radius:4px;background:#b9c6d3}
.doc span{font-size:28px;color:var(--muted);line-height:1.3}.doc b{display:block;color:var(--fg);font-size:31px}
.tag{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;padding:14px 28px;border-radius:999px;background:var(--soft);border:2px solid rgba(58,199,255,.5);font-size:30px;font-weight:600;color:var(--neon)}
.btn{display:inline-block;background:var(--neon);color:var(--on);font-size:50px;font-weight:800;padding:34px 70px;border-radius:999px;box-shadow:0 0 0 3px rgba(58,199,255,.35),0 26px 90px -10px rgba(58,199,255,.75)}
.play{width:200px;height:200px;border-radius:50%;border:6px solid var(--neon);display:flex;align-items:center;justify-content:center;box-shadow:0 0 90px rgba(58,199,255,.6),inset 0 0 40px rgba(58,199,255,.25);background:radial-gradient(circle,#14324d,#0b1c2f)}
.play svg{width:84px;height:84px;margin-left:12px;fill:var(--neon);filter:drop-shadow(0 0 18px rgba(58,199,255,.9))}
.chips{display:flex;flex-wrap:wrap;gap:16px}
.chip{padding:16px 28px;border-radius:999px;background:var(--card);border:3px solid var(--border);font-size:32px;font-weight:600}
</style></head>
