<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url(inter-latin-400-normal.woff);font-weight:400}
@font-face{font-family:Inter;src:url(inter-latin-500-normal.woff);font-weight:500}
@font-face{font-family:Inter;src:url(inter-latin-600-normal.woff);font-weight:600}
@font-face{font-family:Inter;src:url(inter-latin-700-normal.woff);font-weight:700}
@font-face{font-family:Inter;src:url(inter-latin-800-normal.woff);font-weight:800}
@font-face{font-family:Orbitron;src:url(orbitron-latin-700-normal.woff);font-weight:700}
:root{--bg:#0c192a;--card:#172537;--fg:#f0f6fc;--muted:#97a7b7;--neon:#3ac7ff;--on:#061223;--soft:rgba(58,199,255,.15);--border:rgba(40,61,78,.95);--ok:#41d686;--warn:#f9c718;--bad:#f94144}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Inter;color:var(--fg)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
.glow{position:absolute;left:-200px;top:300px;width:1480px;height:1480px;border-radius:50%;
  background:radial-gradient(circle,rgba(58,199,255,.22),rgba(58,199,255,.06) 40%,rgba(12,25,42,0) 65%);animation:breath 6s ease-in-out infinite alternate}
@keyframes breath{from{transform:scale(1);opacity:.85}to{transform:scale(1.08);opacity:1}}
.grid{position:absolute;inset:-100px;background-image:radial-gradient(rgba(58,199,255,.20) 2px,transparent 2.6px);background-size:54px 54px;
  -webkit-mask-image:radial-gradient(circle at 50% 48%,#000 0,transparent 62%);animation:drift 32s linear both}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-162px)}}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(3,8,16,.65) 100%);pointer-events:none}
.scene{position:absolute;inset:0;opacity:0}
.cam{position:absolute;inset:0}
@keyframes sceneIn{from{opacity:0;transform:scale(1.07);filter:blur(14px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes sceneOut{from{opacity:1;transform:none;filter:blur(0)}to{opacity:0;transform:scale(.94);filter:blur(12px)}}
@keyframes ken{from{transform:scale(1)}to{transform:scale(1.045)}}
@keyframes up{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes word{from{opacity:0;transform:translateY(70%) rotate(3deg);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(var(--r,0deg))}60%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(var(--r,0deg))}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(var(--r,0deg))}}
@keyframes popb{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes fly{to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.15) rotate(0deg)}}
@keyframes wob{0%,100%{translate:0 0}50%{translate:0 -12px}}
@keyframes ring{from{transform:translate(-50%,-50%) scale(.9);opacity:.8}to{transform:translate(-50%,-50%) scale(2.1);opacity:0}}
@keyframes dash{from{stroke-dashoffset:500}to{stroke-dashoffset:0}}
@keyframes travel{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes sweep{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(220%) skewX(-20deg)}}
@keyframes dots{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-8px)}}
@keyframes hide{to{opacity:0}}
@keyframes check{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
.hd{position:absolute;left:80px;right:80px;top:250px;font-weight:800;font-size:100px;line-height:1.02;letter-spacing:-3px}
.hd .w{display:inline-block;margin-right:24px;opacity:0}
.c{text-align:center}
.neon{color:var(--neon);text-shadow:0 0 30px rgba(58,199,255,.6)}
.eyebrow{font-family:Orbitron;font-size:28px;letter-spacing:8px;color:var(--neon);margin-bottom:26px;opacity:0}
.abs{position:absolute}
.prob{position:absolute;display:flex;align-items:center;gap:24px;padding:30px 40px;border-radius:34px;background:rgba(23,37,55,.92);border:3px solid var(--border);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.6);opacity:0;font-size:46px;font-weight:700;white-space:nowrap}
.prob .ic{width:88px;height:88px;border-radius:24px;background:rgba(249,199,24,.14);display:flex;align-items:center;justify-content:center}
.prob svg{width:52px;height:52px;stroke:var(--warn);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.prob small{display:block;font-size:29px;font-weight:500;color:var(--muted);margin-top:2px}
.hub{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#14324d,#0b1c2f);border:5px solid var(--neon);
  box-shadow:0 0 90px rgba(58,199,255,.6),inset 0 0 40px rgba(58,199,255,.25);display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);opacity:0}
.hub img{width:232px;height:232px;border-radius:50%}
.ringx{position:absolute;width:300px;height:300px;border-radius:50%;border:4px solid var(--neon);opacity:0}
.pill{display:flex;align-items:center;gap:18px;padding:24px 40px;border-radius:999px;font-size:44px;font-weight:700;background:var(--card);border:3px solid var(--border);opacity:0;white-space:nowrap}
.pill i{width:22px;height:22px;border-radius:50%;display:block;box-shadow:0 0 14px currentColor}
.inp{position:absolute;display:flex;align-items:center;gap:16px;padding:22px 30px;border-radius:28px;font-size:36px;font-weight:700;background:var(--soft);color:var(--neon);border:3px solid rgba(58,199,255,.35);opacity:0}
.inp svg,.wa svg{width:44px;height:44px;stroke:var(--neon);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wa{position:absolute;left:50%;top:1300px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:20px 36px;border-radius:999px;background:rgba(65,214,134,.14);border:3px solid rgba(65,214,134,.6);color:#7ff0b3;font-size:38px;font-weight:700;opacity:0}
.wa svg{stroke:#7ff0b3}
.chat{position:absolute;left:80px;right:80px;top:470px;background:var(--card);border:3px solid var(--border);border-radius:52px;padding:42px;box-shadow:0 50px 140px -30px rgba(58,199,255,.5);opacity:0}
.chead{display:flex;align-items:center;gap:22px;padding-bottom:28px;border-bottom:3px solid var(--border)}
.chead img{width:90px;height:90px;border-radius:50%}
.chead b{font-size:38px;display:block}.chead small{font-size:27px;color:var(--ok)}
.msgs{display:flex;flex-direction:column;gap:24px;margin-top:32px;min-height:600px}
.m{max-width:780px;padding:24px 32px;font-size:42px;line-height:1.38;border-radius:38px;opacity:0}
.u{align-self:flex-end;background:rgba(58,199,255,.2);border-bottom-right-radius:8px;transform-origin:bottom right}
.b{align-self:flex-start;background:rgba(12,25,42,.8);border:3px solid var(--border);border-bottom-left-radius:8px;transform-origin:bottom left}
.typing{display:flex;gap:12px;align-items:center;height:56px}
.typing span{width:16px;height:16px;border-radius:50%;background:var(--muted);animation:dots 1s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
.btn{display:inline-block;position:relative;overflow:hidden;background:var(--neon);color:var(--on);font-size:52px;font-weight:800;padding:36px 76px;border-radius:999px;box-shadow:0 0 0 3px rgba(58,199,255,.35),0 26px 90px -10px rgba(58,199,255,.75)}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:120px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-120%) skewX(-20deg);animation:sweep 1.4s ease-in-out var(--sw,0s) 2}
/* legenda */
#cap{position:absolute;left:70px;right:70px;top:1445px;display:flex;flex-wrap:wrap;justify-content:center;gap:0 18px;font-size:54px;font-weight:800;line-height:1.25;letter-spacing:-.5px;text-align:center}
#cap span{color:#fff;opacity:.98;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 24px rgba(0,0,0,.55);transition:none}
#cap span.on{color:var(--neon);text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 26px rgba(58,199,255,.6)}
#cap span.off{opacity:0}

.phone{position:absolute;left:50%;transform:translateX(-50%);width:600px;border-radius:56px;border:10px solid #22344a;background:#000;overflow:hidden;box-shadow:0 0 0 3px rgba(58,199,255,.35),0 60px 160px -30px rgba(58,199,255,.55);opacity:0}
.crop{position:relative;background-image:url(prova-uno.jpg);background-repeat:no-repeat;border-radius:28px;box-shadow:0 30px 90px -20px rgba(0,0,0,.7)}
.real{display:inline-flex;align-items:center;gap:14px;padding:16px 30px;border-radius:999px;background:rgba(249,65,68,.14);border:3px solid rgba(249,65,68,.65);color:#ff8a8c;font-family:Orbitron;font-size:28px;letter-spacing:5px;font-weight:700}
.real i{width:18px;height:18px;border-radius:50%;background:#f94144;box-shadow:0 0 16px #f94144;animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
@keyframes scan{from{top:0}to{top:100%}}
@keyframes zoomIn{from{transform:scale(.55);opacity:0;filter:blur(10px)}to{transform:none;opacity:1;filter:blur(0)}}
@keyframes slideUp{from{opacity:0;transform:translate(-50%,180px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes grow{from{width:0}to{width:var(--w)}}
.km{font-family:Orbitron;font-weight:700;font-size:118px;color:var(--neon);text-shadow:0 0 40px rgba(58,199,255,.7);letter-spacing:2px}
.lbl{font-family:Orbitron;font-size:26px;letter-spacing:6px;color:var(--muted)}
.notif{position:absolute;left:90px;right:90px;display:flex;gap:26px;align-items:center;padding:30px 34px;border-radius:36px;background:rgba(23,37,55,.96);border:3px solid rgba(58,199,255,.55);box-shadow:0 40px 110px -20px rgba(58,199,255,.5);opacity:0}
.notif img{width:96px;height:96px;border-radius:24px}
.notif b{font-size:38px;display:block}.notif span{font-size:31px;color:var(--muted)}
/* ===== reel 03: personagem e nota ===== */
.guy{position:absolute;left:50%;transform:translateX(-50%);width:520px;height:620px}
.guy svg{width:100%;height:100%;overflow:visible}
.q{position:absolute;font-family:Orbitron;font-weight:700;color:var(--warn);text-shadow:0 0 30px rgba(249,199,24,.7);opacity:0;transform:translate(-50%,-50%)}
.cal{position:absolute;padding:20px 30px;border-radius:24px;background:#f0f6fc;color:#0c192a;font-size:38px;font-weight:800;box-shadow:0 24px 60px -16px rgba(0,0,0,.7);opacity:0;transform:translate(-50%,-50%) rotate(var(--r,0deg))}
.cal small{display:block;font-size:22px;font-weight:600;color:#c0392b;letter-spacing:2px}
.nota{position:absolute;left:50%;width:560px;margin-left:-280px;background:#f7f9fb;color:#1b2735;border-radius:14px;padding:38px 40px 46px;font-size:30px;line-height:1.5;box-shadow:0 50px 120px -30px rgba(58,199,255,.55);opacity:0;font-family:Inter}
.nota h4{font-size:34px;font-weight:800;letter-spacing:1px;text-align:center}
.nota .sub{text-align:center;font-size:22px;color:#6b7a89;margin-bottom:18px}
.nota .ln{display:flex;justify-content:space-between;border-top:2px dashed #c9d3dd;padding:12px 0}
.nota .tot{font-weight:800;font-size:34px}
.nota:after{content:"";position:absolute;left:0;right:0;bottom:-18px;height:20px;background:linear-gradient(-45deg,transparent 12px,#f7f9fb 0) 0 0/24px 20px,linear-gradient(45deg,transparent 12px,#f7f9fb 0) 0 0/24px 20px}
.scanl{position:absolute;left:-20px;right:-20px;height:8px;background:linear-gradient(90deg,transparent,#3ac7ff,transparent);box-shadow:0 0 30px #3ac7ff;opacity:0}
@keyframes scanY{0%{top:0;opacity:1}100%{top:100%;opacity:1}}
.saved{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;padding:22px 38px;border-radius:999px;background:rgba(65,214,134,.14);border:3px solid rgba(65,214,134,.6);color:#7ff0b3;font-size:40px;font-weight:700;opacity:0;white-space:nowrap}
.bub{position:absolute;max-width:820px;padding:26px 34px;font-size:42px;line-height:1.38;border-radius:38px;opacity:0}
.bub.u{right:90px;background:rgba(58,199,255,.2);border-bottom-right-radius:8px;transform-origin:bottom right}
.bub.b{left:90px;background:rgba(23,37,55,.96);border:3px solid var(--border);border-bottom-left-radius:8px;transform-origin:bottom left}
.docb{display:flex;align-items:center;gap:26px}
.docb .ic{width:110px;height:136px;border-radius:14px;background:#f0f6fc;position:relative;flex:none}
.docb .ic i{position:absolute;left:18px;right:18px;height:8px;border-radius:4px;background:#b9c6d3}
.docb b{display:block;font-size:40px}.docb span{font-size:30px;color:var(--muted)}
.odo{display:inline-block;padding:26px 46px;border-radius:30px;background:#050b14;border:4px solid #22344a;box-shadow:inset 0 0 40px rgba(58,199,255,.18),0 30px 90px -20px rgba(58,199,255,.5)}
@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes qpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes calfly{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + 60px)) rotate(calc(var(--r) * 3)) scale(.8)}}
@keyframes shrinkTo{to{opacity:0;transform:translate(0,420px) scale(.15)}}
@keyframes slideUp2{from{opacity:0;transform:translateY(180px)}to{opacity:1;transform:none}}
@keyframes smile{from{opacity:0}to{opacity:1}}
/* ===== reel 05: grátis para sempre ===== */
.tagp{position:absolute;left:50%;top:1000px;width:520px;height:300px;margin-left:-260px;border-radius:40px 40px 40px 40px;background:linear-gradient(160deg,#1c3a57,#0f2236);border:5px solid var(--neon);box-shadow:0 0 90px rgba(58,199,255,.5);display:flex;align-items:center;justify-content:center;font-family:Orbitron;font-weight:700;font-size:150px;color:var(--neon);text-shadow:0 0 40px rgba(58,199,255,.8);transform-origin:50% -120px}
.tagp:before{content:"";position:absolute;top:-120px;left:50%;width:4px;height:120px;background:#7fb8dc}
.tagp:after{content:"";position:absolute;top:26px;left:50%;margin-left:-20px;width:40px;height:40px;border-radius:50%;background:var(--bg);border:4px solid #7fb8dc}
.stamp{position:absolute;padding:20px 50px;border:8px solid var(--ok);border-radius:24px;color:var(--ok);font-family:Orbitron;font-weight:700;font-size:80px;letter-spacing:6px;text-shadow:0 0 30px rgba(65,214,134,.6);box-shadow:0 0 50px -6px rgba(65,214,134,.6),inset 0 0 30px rgba(65,214,134,.25);opacity:0;transform:rotate(-8deg)}
@keyframes stampIn{0%{opacity:0;transform:rotate(-8deg) scale(2.4)}70%{opacity:1;transform:rotate(-8deg) scale(.94)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
.app{position:absolute;left:140px;right:140px;background:var(--card);border:3px solid var(--border);border-radius:52px;padding:44px;box-shadow:0 50px 140px -30px rgba(58,199,255,.5)}
.plate{margin-top:26px;border-radius:18px;background:#f4f6f8;border:5px solid #1b2735;overflow:hidden;color:#11161c}
.plate .bar{background:#1f4fa8;color:#fff;font-size:22px;font-weight:800;letter-spacing:6px;text-align:center;padding:6px 0}
.plate .num{font-family:'Courier New',monospace;font-weight:800;font-size:96px;letter-spacing:10px;text-align:center;padding:8px 0;min-height:126px}
.caret{display:inline-block;width:6px;height:80px;background:#11161c;vertical-align:middle;animation:blink .8s steps(2,start) infinite}
.car{margin-top:30px;display:flex;align-items:center;gap:28px;padding:26px 30px;border-radius:30px;background:rgba(12,25,42,.8);border:3px solid var(--border)}
.car svg{width:150px;height:80px;flex:none}
.car b{font-size:40px;display:block}.car span{font-size:30px;color:var(--muted)}
.tile{position:absolute;width:430px;height:330px;border-radius:40px;background:rgba(23,37,55,.96);border:3px solid var(--border);padding:34px;opacity:0;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.tile .tt{font-size:40px;font-weight:800;margin-top:18px}
.tile .ts{font-size:27px;color:var(--muted);margin-top:6px}
.hbar{height:18px;border-radius:99px;margin-top:12px}
.free{display:inline-block;padding:8px 20px;border-radius:999px;background:rgba(65,214,134,.14);border:2px solid rgba(65,214,134,.6);color:#7ff0b3;font-size:24px;font-weight:700;position:absolute;right:26px;top:26px}
/* ===== reel 06: tá caro? mecânico espertinho ===== */
.mec{position:absolute;width:500px;height:640px}
.mec svg{width:100%;height:100%;overflow:visible}
.orc{position:absolute;width:470px;background:#f7f9fb;color:#1b2735;border-radius:12px;padding:30px 34px 40px;font-size:27px;line-height:1.45;box-shadow:0 40px 100px -30px rgba(0,0,0,.8);transform-origin:50% 0;font-family:Inter}
.orc h4{font-size:30px;font-weight:800;letter-spacing:1px;text-align:center}
.orc .sub{text-align:center;font-size:20px;color:#6b7a89;margin-bottom:12px}
.orc .ln{display:flex;justify-content:space-between;border-top:2px dashed #c9d3dd;padding:8px 0}
.orc .tot{font-weight:800;font-size:36px;color:#c0392b}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.big{position:absolute;font-weight:800;letter-spacing:-4px;text-align:center;left:0;right:0}
.est{position:absolute;left:90px;right:90px;background:rgba(23,37,55,.97);border:3px solid rgba(58,199,255,.55);border-radius:46px;padding:40px 44px;box-shadow:0 50px 140px -30px rgba(58,199,255,.5);opacity:0}
.est .rg{font-family:Orbitron;font-weight:700;font-size:76px;color:var(--neon);text-shadow:0 0 34px rgba(58,199,255,.7);margin:10px 0 6px}
.itm{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:22px;font-size:36px;font-weight:700;opacity:0}
.itm .bw{flex:none;width:300px;height:22px;border-radius:99px;background:rgba(151,167,183,.18);overflow:hidden}
.itm .bw i{display:block;height:100%;border-radius:99px;background:var(--neon);box-shadow:0 0 16px var(--neon);width:0}
.chk{display:flex;align-items:center;gap:24px;padding:22px 30px;border-radius:30px;background:rgba(23,37,55,.96);border:3px solid var(--border);font-size:42px;font-weight:700;opacity:0;margin-top:20px}
.chk .lk{margin-left:auto;font-size:26px;font-weight:700;color:var(--neon);padding:8px 18px;border-radius:999px;background:var(--soft);border:2px solid rgba(58,199,255,.4)}
.sweat{position:absolute;opacity:0}
@keyframes drip{0%{opacity:0;transform:translateY(-10px)}20%{opacity:1}100%{opacity:1;transform:translateY(40px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
/* ===== reel 07: vai vender o carro? ===== */
.sign{position:absolute;padding:14px 26px;background:#fff7d6;color:#1b2735;border:5px solid #1b2735;border-radius:12px;font-family:Orbitron;font-weight:700;font-size:40px;letter-spacing:3px;box-shadow:0 20px 40px -10px rgba(0,0,0,.6)}
.road{position:absolute;left:-100px;right:-100px;height:10px;background:repeating-linear-gradient(90deg,rgba(151,167,183,.35) 0 80px,transparent 80px 140px)}
.tlx{position:absolute;left:110px;right:90px}
.tlx:before{content:"";position:absolute;left:30px;top:30px;bottom:30px;width:6px;border-radius:3px;background:linear-gradient(var(--neon),rgba(58,199,255,.1));transform-origin:top;animation:var(--ln)}
@keyframes lineIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.tix{position:relative;display:flex;gap:30px;align-items:center;margin-bottom:34px;opacity:0}
.tix .dot{flex:none;width:66px;height:66px;border-radius:50%;background:#0c192a;border:5px solid var(--ok);box-shadow:0 0 26px rgba(65,214,134,.7);display:flex;align-items:center;justify-content:center}
.tix .dot svg{width:34px;height:34px;stroke:var(--ok);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tix .cd{flex:1;background:rgba(23,37,55,.96);border:3px solid var(--border);border-radius:32px;padding:26px 32px}
.tix b{display:block;font-size:40px}.tix span{font-size:30px;color:var(--muted)}
.certx{position:absolute;left:110px;right:110px;border-radius:44px;padding:50px 46px;background:linear-gradient(160deg,#16314b,#0f2236);border:4px solid var(--neon);box-shadow:0 0 120px -10px rgba(58,199,255,.6);opacity:0;text-align:center}
.sealx{width:200px;height:200px;margin:0 auto 26px;border-radius:50%;border:8px solid var(--neon);display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(58,199,255,.6),inset 0 0 40px rgba(58,199,255,.3)}
.sealx img{width:150px;height:150px;border-radius:50%}
.certx h3{font-family:Orbitron;font-size:44px;letter-spacing:4px;color:var(--neon)}
.certx .r{display:flex;justify-content:space-between;font-size:34px;padding:16px 0;border-top:2px solid rgba(58,199,255,.25);text-align:left}
.certx .r span{color:var(--muted)}
.okp{display:inline-flex;align-items:center;gap:18px;padding:24px 40px;border-radius:999px;background:rgba(65,214,134,.14);border:3px solid rgba(65,214,134,.6);color:#7ff0b3;font-size:46px;font-weight:700;opacity:0}
/* ===== reel 08: eu também tenho app ===== */
.ph{position:absolute;left:50%;width:560px;height:1040px;margin-left:-280px;border-radius:70px;border:12px solid #22344a;background:#060d18;overflow:hidden;box-shadow:0 0 0 3px rgba(58,199,255,.35),0 60px 160px -30px rgba(58,199,255,.55)}
.ph .notch{position:absolute;left:50%;top:16px;width:150px;height:34px;margin-left:-75px;border-radius:20px;background:#000;z-index:5}
.scr{position:absolute;inset:0;opacity:0}
.url{margin:74px 26px 0;padding:16px 24px;border-radius:22px;background:#152536;color:#cfe3f3;font-size:26px;display:flex;align-items:center;gap:12px}
.url svg{width:26px;height:26px;stroke:#7ff0b3;fill:none;stroke-width:2.4}
.lp{padding:40px 34px;text-align:center}
.lp .lg{width:130px;height:130px;border-radius:50%;margin:20px auto 22px;box-shadow:0 0 50px rgba(58,199,255,.6)}
.lp h5{font-family:Orbitron;font-size:40px;letter-spacing:6px;color:var(--neon)}
.lp p{font-size:28px;color:var(--muted);margin-top:14px;line-height:1.35}
.ibtn{display:inline-flex;align-items:center;gap:14px;margin-top:40px;padding:26px 38px;border-radius:999px;background:var(--neon);color:var(--on);font-size:32px;font-weight:800;box-shadow:0 20px 60px -10px rgba(58,199,255,.8)}
.ibtn svg{width:34px;height:34px;stroke:var(--on);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes press{0%,100%{transform:scale(1)}45%{transform:scale(.9);filter:brightness(1.25)}}
.tap{position:absolute;width:120px;height:120px;border-radius:50%;border:6px solid #fff;opacity:0;transform:translate(-50%,-50%)}
@keyframes tapk{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}30%{opacity:.95;transform:translate(-50%,-50%) scale(.8)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}}
.home{position:absolute;inset:0;padding:110px 40px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:46px 26px;align-content:start;background:radial-gradient(circle at 50% 30%,#163452,#060d18 75%)}
.ap{width:100px;height:100px;border-radius:26px;margin:0 auto;background:rgba(151,167,183,.16);border:2px solid rgba(151,167,183,.18)}
.apj{position:relative;text-align:center}
.apj img{width:100px;height:100px;border-radius:26px;box-shadow:0 0 40px rgba(58,199,255,.9)}
.apj span{display:block;font-size:22px;margin-top:8px;font-weight:600}
.bigtile{position:absolute;left:110px;right:110px;display:flex;gap:30px;align-items:center;padding:34px 40px;border-radius:40px;background:rgba(23,37,55,.96);border:3px solid var(--border);box-shadow:0 30px 80px -20px rgba(0,0,0,.6);opacity:0}
.bigtile .ico{flex:none;width:150px;height:150px;border-radius:34px;background:var(--soft);border:3px solid rgba(58,199,255,.4);display:flex;align-items:center;justify-content:center}
.bigtile b{display:block;font-size:46px}.bigtile span{display:block;font-size:31px;color:var(--muted);margin-top:6px}
.mini{font-family:'Courier New',monospace;font-weight:800;font-size:30px;letter-spacing:3px;background:#f4f6f8;color:#11161c;border:4px solid #1b2735;border-radius:10px;padding:2px 8px;position:relative}
.mini:before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:#1f4fa8}
</style></head>
<body><div id="stage">
<div class="glow"></div><div class="grid"></div>
<div id="scenes"></div>
<div id="cap"></div>
<div class="vig"></div>
</div>
<script>
const VO = 0.5;
const W0 = [["Eu", 0, 0.16], ["também", 0.24, 0.48], ["tenho", 0.56, 0.72], ["app.", 0.8, 1.28], ["E", 1.44, 1.52], ["você", 1.56, 1.76], ["instala", 1.88, 2.16], ["direto", 2.28, 2.48], ["do", 2.56, 2.64], ["site:", 2.72, 3.44], ["toca", 3.48, 3.76], ["em", 3.88, 4], ["\"Instalar", 4.04, 4.56], ["o", 4.6, 4.64], ["app", 4.72, 4.96], ["Jarvys\"", 5.12, 5.6], ["e", 5.64, 5.68], ["pronto,", 5.84, 6.4], ["eu", 6.48, 6.56], ["fico", 6.6, 6.8], ["na", 6.84, 6.88], ["tela", 6.96, 7.2], ["do", 7.28, 7.36], ["seu", 7.4, 7.52], ["celular.", 7.6, 8.32], ["Lá", 8.36, 8.48], ["dentro", 8.56, 8.88], ["tem", 8.96, 9.04], ["a", 9.067, 9.093], ["garagem", 9.12, 9.44], ["pela", 9.52, 9.68], ["placa,", 9.76, 10.32], ["a", 10.36, 10.4], ["saúde", 10.48, 10.8], ["do", 10.88, 10.96], ["carro", 11.04, 11.44], ["e", 11.48, 11.52], ["o", 11.56, 11.6], ["Dr.", 11.64, 11.92], ["Jarvys", 12, 12.4], ["pra", 12.44, 12.48], ["tirar", 12.56, 12.8], ["suas", 12.84, 13.04], ["dúvidas.", 13.093, 13.84], ["E", 13.88, 13.92], ["o", 14, 14.16], ["app", 14.32, 14.4], ["é", 14.48, 14.56], ["grátis", 14.64, 14.96], ["pra", 15.12, 15.28], ["sempre.", 15.44, 16.053], ["Cria", 16.107, 16.24], ["sua", 16.32, 16.48], ["conta", 16.72, 16.773], ["e", 16.8, 16.84], ["me", 16.88, 17], ["instala", 17.12, 17.36], ["hoje.", 17.44, 17.92]];
const T = {total: 23, s1:[0,3.6], s2:[3.6,8.75], s3:[8.75,14.3], s4:[14.3,16.55], s5:[16.55,23],
  words: W0.map(([w,a,b]) => [w.replace(/"/g,''), +(a+VO).toFixed(3), +(b+VO).toFixed(3)]),
  breaks: [0, 4, 10, 16, 18, 25, 32, 40, 44, 51]};
T.stamp = 1.35; T.tap = 5.0; T.home = 6.45; T.icon = 7.0; T.t1 = 9.6; T.t2 = 10.95; T.t3 = 12.15; T.zero = 14.9; T.free = 15.6; T.btn = 17.3; T.url = 18.0; T.sub = 18.6;
window.T = T;
const ICON = 'icon-512.png';
const an = (list) => list.filter(Boolean).join(', ');
const A = (name, dur, at, ease = 'cubic-bezier(.2,.8,.2,1)', fill = 'both') => `${name} ${dur}s ${ease} ${at}s ${fill}`;
const sceneStyle = (s, last, noIn) => `${noIn ? 'opacity:1;' : ''}animation:${an([noIn ? '' : A('sceneIn', .55, s[0]), last ? '' : A('sceneOut', .45, s[1] - .45, 'ease-in', 'forwards')])}`;
const camStyle = (s) => `animation:${A('ken', s[1] - s[0], s[0], 'linear')}`;
const words = (txt, at, step, cls = '') => txt.split(' ').map((w, i) => `<span class="w ${cls}" style="animation:${A('word', .55, at + i * step)}">${w}</span>`).join('');
const neonWords = (txt, at, step) => words(txt, at, step, 'neon');
const BOUNCE = 'cubic-bezier(.34,1.56,.64,1)';
const IDL = '<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';
const ILK = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
let h = '';

// CENA 1: gancho
h += `<div class="scene" style="${sceneStyle(T.s1, false, true)}"><div class="cam" style="${camStyle(T.s1)}">
  <div class="eyebrow c" style="position:absolute;left:0;right:0;top:260px;opacity:1">VOCÊ SABIA?</div>
  <div class="big" style="top:330px;font-size:150px;line-height:1">O Jarvys<br><span class="neon">tem app?</span></div>
  <div class="ph" style="top:720px;height:640px;width:400px;margin-left:-200px;border-radius:56px;animation:wob 3s ease-in-out infinite"><div class="notch"></div>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#163452,#060d18 75%)"><img src="${ICON}" style="width:170px;height:170px;border-radius:40px;box-shadow:0 0 60px rgba(58,199,255,.9)"></div></div>
  <div class="stamp" style="left:560px;top:1080px;font-size:66px;animation:${A('stampIn', .45, T.stamp, BOUNCE)}">TEM, SIM</div>
</div></div>`;

// CENA 2: instala pelo site
h += `<div class="scene" style="${sceneStyle(T.s2)}"><div class="cam" style="${camStyle(T.s2)}">
  <div class="hd c" style="top:225px;font-size:70px;letter-spacing:-2px">${words('Toca em', T.s2[0] + .15, .12)}<br>${neonWords('Instalar o app Jarvys', 4.6, .14)}</div>
  <div class="ph" style="top:440px;height:950px;animation:${A('slideUp2', .6, T.s2[0] + .1)}"><div class="notch"></div>
    <div class="scr" style="opacity:1;animation:${A('hide', .3, T.home, 'ease', 'forwards')}">
      <div class="url">${ILK.replace('<svg', '<svg')}<span>jarvys.com.br</span></div>
      <div class="lp"><img class="lg" src="${ICON}"><h5>JARVYS</h5><p>A IA que cuida do seu carro</p>
        <div class="ibtn" style="animation:${A('press', .35, T.tap - .05, 'ease-in-out', 'none')}">${IDL}Instalar o app Jarvys</div></div>
    </div>
    <div class="scr" style="animation:${A('fade', .35, T.home)}"><div class="home">
      ${[...Array(12).keys()].map(i => i === 5 ? `<div class="apj" style="opacity:0;animation:${A('popb', .55, T.icon, BOUNCE)}"><img src="${ICON}"><span>Jarvys</span></div>` : '<div class="ap"></div>').join('')}
    </div></div>
  </div>
  <div class="tap" id="tap" style="left:540px;top:1010px;animation:${A('tapk', .7, T.tap - .1, 'ease-out')}"></div>
</div></div>`;

// CENA 3: lá dentro
const tile = (ico, b, s, at, top) => `<div class="bigtile" style="top:${top}px;animation:${A('slideUp2', .5, at)}"><div class="ico">${ico}</div><div><b>${b}</b><span>${s}</span></div></div>`;
const icoPlate = `<div class="mini" style="margin-top:6px">ABC1D23</div>`;
const icoHealth = `<div style="width:96px">${[['var(--ok)', 96], ['var(--ok)', 80], ['var(--warn)', 56]].map(([c, w]) => `<div class="hbar" style="width:${w}px;background:${c};box-shadow:0 0 12px ${c}"></div>`).join('')}</div>`;
const icoDr = `<svg viewBox="0 0 24 24" style="width:80px;height:80px;stroke:var(--neon);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M4 5h16v11H9l-5 4z"/><path d="M12 8v5M9.5 10.5h5"/></svg>`;
h += `<div class="scene" style="${sceneStyle(T.s3)}"><div class="cam" style="${camStyle(T.s3)}">
  <div class="hd c" style="top:250px;font-size:104px">${words('Lá dentro:', T.s3[0] + .1, .14)}</div>
  ${tile(icoPlate, 'Garagem pela placa', 'modelo, ano e FIPE', T.t1, 470)}
  ${tile(icoHealth, 'Status de Saúde', 'óleo, filtros, pastilhas', T.t2, 770)}
  ${tile(icoDr, 'Dr. Jarvys', 'tira suas dúvidas no chat', T.t3, 1070)}
</div></div>`;

// CENA 4: grátis pra sempre
h += `<div class="scene" style="${sceneStyle(T.s4)}"><div class="cam" style="${camStyle(T.s4)}">
  <div class="hd c" style="top:300px;font-size:96px">${words('E o app é', T.s4[0] + .1, .12)}</div>
  <div class="abs c" style="left:0;right:0;top:470px;font-family:Orbitron;font-weight:700;font-size:300px;color:var(--neon);text-shadow:0 0 60px rgba(58,199,255,.8);opacity:0;animation:${A('zoomIn', .5, T.zero)}">R$ 0</div>
  <div class="stamp" style="left:140px;top:900px;font-size:46px;letter-spacing:3px;animation:${A('stampIn', .45, T.free, BOUNCE)}">GRÁTIS PRA SEMPRE</div>
</div></div>`;

// CENA 5: fecho
h += `<div class="scene" style="${sceneStyle(T.s5, true)}"><div class="cam" style="${camStyle(T.s5)}">
  <div class="abs" style="left:0;right:0;top:300px;text-align:center"><div class="hub" style="position:relative;display:inline-flex;left:150px;top:150px;opacity:1"><img src="${ICON}"></div></div>
  <div class="hd c" style="top:680px;font-size:88px">${words('Cria sua conta', T.s5[0] + .1, .1)}<br>${neonWords('e me instala hoje.', 17.4, .12)}</div>
  <div class="abs" style="left:0;right:0;top:1000px;text-align:center;animation:${A('popb', .55, T.btn + .4, BOUNCE)}"><span class="btn" style="--sw:${T.btn + 1}s">Crie sua conta grátis</span></div>
  <div class="abs" style="left:0;right:0;top:1190px;text-align:center;font-size:58px;font-weight:800;color:var(--neon);text-shadow:0 0 26px rgba(58,199,255,.5);animation:${A('up', .5, T.url + .3)}">jarvys.com.br</div>
  <div class="abs" style="left:0;right:0;top:1290px;text-align:center;font-size:34px;color:var(--muted);animation:${A('up', .5, T.sub + .3)}">e 30 dias com tudo liberado</div>
</div></div>`;
document.getElementById('scenes').innerHTML = h;

const capEl = document.getElementById('cap');
const CH = T.breaks.map((i0, k) => [i0, (T.breaks[k + 1] ?? T.words.length)]);
window.setT = (t) => {
  let cur = null;
  for (const [i0, i1] of CH) {
    const st = T.words[i0][1] - 0.12, nx = (i1 < T.words.length ? T.words[i1][1] - 0.12 : T.words[i1 - 1][2] + 0.5);
    const en = Math.min(nx, T.words[i1 - 1][2] + 0.9);
    if (t >= st && t < en) { cur = [i0, i1]; break; }
  }
  if (!cur || t < 0.3) { capEl.innerHTML = ''; return; }
  capEl.innerHTML = T.words.slice(cur[0], cur[1]).map(([w, a, b]) => `<span class="${t < a - 0.05 ? 'off' : (t < b + 0.08 ? 'on' : '')}">${w}</span>`).join('');
};
</script></body></html>
